name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  safety:
    name: No game material, links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse game files and binaries
        run: |
          bad=$(git ls-files | grep -Ei '\.(apk|dex|so|bin|dat|zip|pvr|z|nct|obb)$' || true)
          if [ -n "$bad" ]; then echo "Game or binary files must not be committed:"; echo "$bad"; exit 1; fi
      - name: Check relative links in Markdown
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          bad = []
          for f in Path(".").rglob("*.md"):
              if ".git" in f.parts:
                  continue
              for m in re.finditer(r"\]\(([^)#\s]+)(#[^)]*)?\)", f.read_text(encoding="utf-8")):
                  t = m.group(1)
                  if t.startswith(("http://", "https://", "mailto:")):
                      continue
                  if not (f.parent / t).exists():
                      bad.append(f"{f}: {t}")
          print("\n".join(bad) or "all relative links resolve")
          sys.exit(1 if bad else 0)
          EOF
