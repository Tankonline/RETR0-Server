<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="RETR0 Server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <!-- speed lines -->
  <g stroke="#ff7a18" stroke-linecap="round">
    <line x1="80" y1="112" x2="250" y2="112" stroke-width="6" opacity="0.9"/>
    <line x1="40" y1="150" x2="250" y2="150" stroke-width="6" opacity="0.6"/>
    <line x1="110" y1="188" x2="250" y2="188" stroke-width="6" opacity="0.35"/>
  </g>
  <text x="280" y="178" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="112" font-weight="800"
        letter-spacing="6" fill="#ffffff">RETR<tspan fill="url(#accent)">0</tspan></text>
  <text x="286" y="232" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="600"
        letter-spacing="10" fill="#9fb3d9">SERVER</text>
  <!-- server rack glyph -->
  <g transform="translate(930 80)" fill="none" stroke="#9fb3d9" stroke-width="5" stroke-linejoin="round">
    <rect x="0" y="0" width="190" height="40" rx="8"/>
    <rect x="0" y="54" width="190" height="40" rx="8"/>
    <rect x="0" y="108" width="190" height="40" rx="8"/>
    <circle cx="160" cy="20" r="6" fill="#ff7a18" stroke="none"/>
    <circle cx="160" cy="74" r="6" fill="#ffb347" stroke="none"/>
    <circle cx="160" cy="128" r="6" fill="#3ddc97" stroke="none"/>
    <line x1="20" y1="20" x2="110" y2="20"/><line x1="20" y1="74" x2="110" y2="74"/><line x1="20" y1="128" x2="110" y2="128"/>
  </g>
  <text x="1170" y="276" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18"
        fill="#5f6f94">Project RETR0 · preservation · local only</text>
</svg>
